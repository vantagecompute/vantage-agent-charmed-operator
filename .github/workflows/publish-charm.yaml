name: Publish charm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Pack and publish to Charmhub
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    env:
      CHANNEL: ${{ vars.CHARMHUB_CHANNEL || 'edge' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 6/stable

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml)"
          if [[ -z "$pyproject_version" ]]; then
            echo "pyproject.toml does not define a version" >&2
            exit 1
          fi
          if [[ "$pyproject_version" != "$tag_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${pyproject_version}" >&2
            exit 1
          fi

      - name: Check uv lockfile
        run: uv lock --check

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Pack charm
        run: charmcraft pack --use-lxd

      - name: Upload and release charm
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
        run: |
          set -euo pipefail
          charm_file="$(find . -maxdepth 1 -name '*.charm' -print -quit)"
          if [[ -z "$charm_file" ]]; then
            echo "No .charm file produced by charmcraft pack" >&2
            exit 1
          fi
          charmcraft upload "$charm_file" --release "$CHANNEL"
